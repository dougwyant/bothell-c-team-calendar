name: Update Bothell C-Team calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  build-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Fetch schedule
        run: python src/scrape.py

      - name: Build ICS
        run: python src/build_ics.py --input output/raw_schedule.html --output output/bothell-c-team.ics

      - name: Publish calendar output
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

  deploy:
    needs: build-calendar
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
